version: '3.8'

services:
  coturn:
    image: instrumentisto/coturn
    restart: always
    ports:
      - "3478:3478"
      - "3478:3478/udp"
    environment:
      - REALM=yourdomain.com
      - EXTERNAL_IP=YOUR_PUBLIC_IP
      - LISTEN_PORT=3478
      - USERS=user:pass
    command: >
      --no-cli
      --no-web-admin
      --realm yourdomain.com
      --use-auth-secret
      --static-auth-secret=your_secret_key
      --lt-cred-mech
      --fingerprint
      --no-multicast-peers
      --no-tcp-relay
